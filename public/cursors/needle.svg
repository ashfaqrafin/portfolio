<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- a sewing needle in the site's ink, outlined in paper with a soft shadow so it
       reads on paper, on the pencil hatching and on the dark cards. Hotspot: the
       point (2,2). -->
